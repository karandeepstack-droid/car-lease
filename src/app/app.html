<!-- src/app/app.html (FINAL UPDATED) -->
<header class="global-header">
  <div class="left-nav">
    <!-- Sidebar menu -->
    <button class="hamburger" (click)="sidebar.open()" aria-label="Open menu">☰</button>

    <span class="nav-item" [routerLink]="['/']">🏠 Home</span>
    <span class="nav-item" [routerLink]="['/']">🚗 Cars</span>

    <!-- Visible only when logged in -->
    <span
      class="nav-item"
      *ngIf="auth.isLoggedIn()"
      [routerLink]="['/my-bookings']"
    >
      📘 My Bookings
    </span>
  </div>

  <h2 class="logo" [routerLink]="['/']">CarLease</h2>

  <div class="right-nav">

    <!-- Search bar -->
    <form class="header-search" (ngSubmit)="onSearch()" role="search">
      <input
        type="search"
        placeholder="Search cars..."
        [(ngModel)]="search"
        name="q"
        aria-label="Search cars"
        (input)="onSearch($event.target.value)"
      />
    </form>

    <!-- Cart -->
    <span class="cart-count"
          [routerLink]="['/cart']"
          role="button"
          aria-label="View cart">
      🛒 {{ cart.getCount() }}
    </span>

    <!-- IF NOT LOGGED IN -->
    <ng-container *ngIf="!auth.isLoggedIn(); else loggedUser">
      <button class="login-btn" [routerLink]="['/login']">Login</button>
      <button class="signup-btn" [routerLink]="['/register']">Sign up</button>
    </ng-container>

    <!-- IF LOGGED IN -->
    <ng-template #loggedUser>
      <div class="user-menu">
        <span class="user-name">👤 {{ auth.getUser()?.name }}</span>
        <button class="logout-btn" (click)="logout()">Logout</button>
      </div>
    </ng-template>

  </div>
</header>

<!-- Sidebar -->
<app-sidebar></app-sidebar>

<main>
  <router-outlet></router-outlet>
</main>

<!-- Toasts -->
<app-toast></app-toast>

<!-- Footer -->
<app-footer></app-footer>
