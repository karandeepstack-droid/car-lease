<div class="detail-media">
  <div class="media-hero">
    <div class="hero-image-wrap">
      <img
        class="hero-image"
        [src]="images[current]"
        [alt]="car?.name"
        (click)="openZoom(images[current])"
      />

      <!-- arrows -->
      <button class="hero-arrow left" (click)="prev()" aria-label="Previous image">‹</button>
      <button class="hero-arrow right" (click)="next()" aria-label="Next image">›</button>
    </div>

    <!-- dots -->
    <div class="hero-dots" *ngIf="images.length > 1">
      <button
        *ngFor="let img of images; let i = index"
        (click)="current = i"
        [class.active]="i === current"
        aria-label="Go to image {{ i + 1 }}"
      ></button>
    </div>

    <!-- thumbnails -->
    <div class="thumbs" *ngIf="images.length > 1">
      <button
        *ngFor="let img of images; let i = index"
        class="thumb-btn"
        [class.active]="i === current"
        (click)="current = i"
      >
        <img [src]="img" [alt]="car?.name + ' thumbnail ' + (i+1)" />
      </button>
    </div>
  </div>
</div>

<!-- zoom overlay -->
<div class="zoom-overlay" *ngIf="zoomOpen" (click)="closeZoom()">
  <div class="zoom-inner" (click)="$event.stopPropagation()">
    <img [src]="zoomImage" alt="Zoomed image" />
    <button class="zoom-close" (click)="closeZoom()" aria-label="Close zoom">✕</button>
  </div>
</div>

<!-- details box -->
<div class="detail-info" *ngIf="car">
  <button class="back-btn" [routerLink]="['/']">← Back to home</button>
  <h1 class="car-name">{{ car.name || (car.make + ' ' + car.model) }}</h1>

  <div class="meta">
    <div><strong>Year:</strong> {{ car.year }}</div>
    <div><strong>Seats:</strong> {{ car.seats }}</div>
    <div><strong>Fuel:</strong> {{ car.fuel }}</div>
    <div><strong>Transmission:</strong> {{ car.transmission }}</div>
  </div>

  <p class="description">{{ car.description }}</p>

  <div class="price-box">
    <div class="price">₹ {{ car.pricePerDay }}/day</div>
    <div class="actions">
      <button class="btn-add" (click)="addToCart()">Add to cart</button>
      <button class="btn-book" [routerLink]="['/checkout']">Book Now</button>
    </div>
  </div>
</div>
