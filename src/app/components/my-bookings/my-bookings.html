<div class="page">
  <h2>My Bookings</h2>

  <div *ngIf="loading" class="loading">Loading…</div>

  <div *ngIf="!loading && bookings.length === 0" class="empty">
    No bookings found.
  </div>

  <div class="booking-list" *ngIf="bookings.length > 0">
    <div class="booking-card" *ngFor="let b of bookings">

      <div class="left">
        <img [src]="b.carId?.image || '/assets/cars/car1.jpg'" alt="car" />
      </div>

      <div class="right">
        <h3>{{ b.carId?.name }}</h3>

        <p class="dates">
          {{ b.startDate | date:'mediumDate' }} →
          {{ b.endDate | date:'mediumDate' }}
        </p>

        <p class="price">₹ {{ b.totalPrice }}</p>

        <span class="status" [class.ok]="b.status === 'confirmed'">
          {{ b.status }}
        </span>
      </div>
    </div>
  </div>
</div>
